<script src="lucide.min.js"></script>
<style>
  /* Doylestown Pickleball colors, dark version for black walls */
  :root{
    /* website: navy #1D4A62 · teal #2198A1 · blue #3374FF · logo teal #00808f */
    --navy:#1D4A62; --navy-dk:#12303f; --logo:#00808f; --teal:#2198A1; --teal-lt:#4fbfc7; --blue:#3374FF;
    --ink:#eef5f7; --muted:#a3b8c2; --dim:#5f7884; --bg:#03070a; --card:#0a1922; --line:#163242;
    --accent:#2198A1; --accent-text:#4fbfc7; --accent-glow:rgba(33,152,161,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;cursor:none;background:var(--bg)}
  body{font-family:"PT Sans",Inter,Helvetica,Arial,sans-serif;color:var(--ink);
    display:grid;grid-template-rows:auto 1fr auto;position:relative}
  /* slow drifting glow so the screen never looks frozen */
  body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
    background:radial-gradient(circle at 30% 20%,rgba(33,152,161,.12),transparent 35%),
               radial-gradient(circle at 75% 80%,rgba(29,74,98,.28),transparent 40%);
    animation:drift 40s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(6%,-4%) scale(1.08)}}
  [data-lucide]{display:inline-block}
  svg.lucide{width:1em;height:1em;stroke-width:2}

  /* ---------- Header ---------- */
  header{display:flex;align-items:center;gap:2vw;padding:1.5vw 2.6vw .4vw}
  .brand{display:flex;align-items:center;gap:1.1vw;flex:1;min-width:0}
  .brand img{width:5vw;height:5vw;flex:none}
  .brand .name{font-weight:700;font-size:2.2vw;line-height:1}
  .brand .loc{margin-top:.45vw;font-size:.85vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--teal)}
  .pill{display:flex;align-items:center;gap:1vw;background:var(--card);border:1px solid var(--line);
    border-radius:1.2vw;padding:.8vw 1.4vw;line-height:1}
  .wx{display:none}
  .wx.on{display:flex}
  .wx .ico{font-size:2.6vw;color:var(--teal-lt)}
  .wx .temp{font-size:2.6vw;font-weight:700}
  .wx .meta{font-size:.95vw;color:var(--muted);line-height:1.35}
  .wx .meta b{color:var(--ink)}
  .clock{text-align:right}
  .clock .t{font-size:2.6vw;font-weight:700;font-variant-numeric:tabular-nums}
  .clock .d{font-size:.95vw;color:var(--muted);margin-top:.35vw}

  /* ---------- Stage ---------- */
  main{position:relative;margin:1.2vw 2.6vw}
  .slide{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:3.5vw;
    padding:3vw 3.6vw 3vw 4.4vw;border-radius:1.8vw;overflow:hidden;
    background:linear-gradient(135deg,rgba(29,74,98,.35) 0%,var(--card) 50%);
    border:1px solid var(--line);box-shadow:0 1.5vw 4vw rgba(0,0,0,.55);
    opacity:0;transform:scale(.985);transition:opacity .8s ease,transform .8s ease}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.6vw;background:var(--accent)}
  .slide.on{opacity:1;transform:none}
  /* text stagger */
  .slide .txt > *{opacity:0;transform:translateY(1.2vw);transition:opacity .7s ease,transform .7s ease}
  .slide.on .txt > *{opacity:1;transform:none}
  .slide.on .txt > *:nth-child(2){transition-delay:.12s}
  .slide.on .txt > *:nth-child(3){transition-delay:.24s}
  .slide.on .txt > *:nth-child(4){transition-delay:.36s}
  .slide.on .txt > *:nth-child(5){transition-delay:.48s}
  .txt{min-width:0;position:relative}
  .eyebrow{display:inline-flex;align-items:center;gap:.6vw;font-size:1.15vw;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--accent-text,var(--accent));border:2px solid var(--accent);
    padding:.5vw 1.3vw;border-radius:99px;margin-bottom:1.8vw}
  h1{font-size:6vw;line-height:1;font-weight:700;letter-spacing:-.01em}
  h2{font-size:2.6vw;font-weight:700;color:var(--accent-text,var(--accent));margin-top:1.3vw;line-height:1.2}
  p{font-size:2.15vw;color:var(--muted);margin-top:1.6vw;line-height:1.4;max-width:58vw}
  .chips{display:flex;flex-wrap:wrap;gap:1vw;margin-top:2.2vw}
  .chip{font-size:1.6vw;font-weight:700;padding:.8vw 1.5vw;border-radius:.9vw;
    background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink)}

  /* Right-hand visual: icon tile */
  .tile{width:24vw;height:24vw;border-radius:2vw;display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 30% 25%,var(--accent-glow),transparent 65%),linear-gradient(145deg,var(--navy-dk),#08141b);
    border:1px solid var(--line)}
  .tile .big{font-size:11vw;color:#fff;opacity:.95}
  .tile .big svg.lucide{stroke-width:1.5}
  .slide.on .tile .big{animation:float 6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-.8vw)}}

  /* QR panel */
  .qr{width:24vw;border-radius:2vw;padding:1.6vw;text-align:center;
    background:linear-gradient(160deg,var(--navy) ,#0a1922);border:1px solid #2a5a72;position:relative;z-index:2;
    box-shadow:0 1.5vw 3vw rgba(0,0,0,.5)}
  .qr .code{background:#e9f1f3;padding:1.1vw;border-radius:1vw}
  .qr .code svg{width:100%;height:auto;display:block}
  .qr span svg.lucide{width:1.6vw;height:1.6vw}
  .qr span{display:flex;align-items:center;justify-content:center;gap:.6vw;color:#fff;font-weight:700;
    font-size:1.3vw;margin-top:1.1vw;letter-spacing:.08em;text-transform:uppercase}

  /* Photo: fills the right side and fades into the dark card */
  .pic{position:absolute;top:0;right:0;bottom:0;width:62%;z-index:0;overflow:hidden}
  .pic img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(.85)}
  .pic::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,var(--card) 0%,rgba(10,25,34,.85) 22%,rgba(10,25,34,.25) 55%,rgba(10,25,34,.15) 100%),
               linear-gradient(0deg,rgba(3,7,10,.55),transparent 35%)}
  .slide.on .pic img{animation:kenburns 14s ease-out forwards}
  .slide.hasPic .txt{z-index:1}
  .slide.hasPic .txt h1,.slide.hasPic .txt p{text-shadow:0 .2vw 1.2vw rgba(0,0,0,.6)}
  .slide.hero .pic{width:100%}
  .slide.hero .pic::after{background:radial-gradient(ellipse at 50% 55%,rgba(7,18,25,.62),rgba(7,18,25,.88) 75%)}

  /* "logo" accent: light blue from the logo */
  .slide.logoTeal{--accent:#00808f;--accent-text:#45c4cf;--accent-glow:rgba(0,128,143,.5)}

  /* Welcome hero */
  .slide.hero{grid-template-columns:1fr;text-align:center;justify-items:center;
    background:radial-gradient(circle at 50% 0%,rgba(33,152,161,.28),transparent 60%),linear-gradient(160deg,var(--navy-dk),#071219)}
  .slide.hero::before{display:none}
  .slide.hero .heroLogo{width:10vw;height:10vw;margin:0 auto 1.6vw;display:block}
  .slide.hero h1{font-size:6.4vw;white-space:nowrap}
  .slide.hero h1 .pre{display:block;font-size:.45em;font-weight:400;color:var(--teal-lt);letter-spacing:.04em;margin-bottom:.35em}
  .slide.hero .txt{max-width:94vw}
  .slide.hero h2{color:var(--teal-lt)}
  .slide.hero p{margin-left:auto;margin-right:auto}
  .slide.hero .chips{justify-content:center}

  /* Photo slide */
  .slide.photo{display:block;padding:0}
  .slide.photo::before{display:none}
  .slide.photo img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slide.on.photo img.bg{animation:kenburns 20s ease-out forwards}
  @keyframes kenburns{from{transform:scale(1.08)}to{transform:scale(1)}}
  .slide.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:6vw 4vw 2.6vw;
    background:linear-gradient(transparent,rgba(4,8,11,.92))}
  .slide.photo h1{font-size:4.2vw}

  /* CourtReserve live courts */
  .slide.courts{display:flex;flex-direction:column;align-items:stretch;gap:.5vw;padding:.6vw .6vw .6vw 1.2vw;border-radius:.8vw}
  .slide.courts::before{width:.35vw}
  .courtsHead{display:flex;align-items:center;justify-content:space-between;gap:1.5vw;padding:0 .4vw}
  .courtsHead h1{font-size:1.9vw;flex:1}
  .courtsHead .now{font-size:1.9vw;font-weight:700;font-variant-numeric:tabular-nums}
  .live{display:flex;align-items:center;gap:.6vw;font-weight:700;font-size:1.2vw;letter-spacing:.2em;color:var(--teal)}
  .live i{width:1vw;height:1vw;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .courtsBody{flex:1;border-radius:.5vw;overflow:hidden;background:#0b161d;position:relative}
  .courtsBody iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  /* CourtReserve lobby view: rendered at a fixed desktop size, scaled to fit, and panned to "now" */
  .cr{position:absolute;left:0;right:0;overflow:hidden}
  .cr iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none;inset:auto}
  .cr.body iframe{transition:transform 1.5s ease}
  .courtsBody .embed{position:absolute;inset:0;overflow:hidden}

  /* Courts slides take over the whole screen: header and footer tuck away */
  body.wide header,body.wide footer{display:none}
  body.wide main{margin:.6vw}
  /* auto-fit: text shrinks when it would not fit the slide */
  .slide .txt{transform-origin:left center}
  .slide.hero .txt{transform-origin:center center}

  /* ---------- Footer ---------- */
  footer{padding:0 2.6vw 1.5vw}
  .segs{display:flex;gap:.5vw;margin-bottom:1.1vw}
  .seg{flex:1;height:.35vw;border-radius:99px;background:#122a37;overflow:hidden}
  .seg i{display:block;height:100%;width:0;background:var(--teal);border-radius:99px}
  .seg.done i{width:100%;background:var(--navy)}
  .footrow{display:flex;align-items:center;justify-content:space-between;gap:2vw}
  .next{display:flex;align-items:center;gap:1vw;font-size:1.35vw;color:var(--muted);min-width:0}
  .next b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .next .lbl{font-size:.9vw;font-weight:700;letter-spacing:.22em;color:var(--teal);text-transform:uppercase}
  .contact{display:flex;align-items:center;gap:1.4vw;font-size:1.25vw;color:var(--muted);white-space:nowrap}
  .msg{display:flex;align-items:center;gap:.6vw;background:var(--navy);color:#fff;font-weight:700;padding:.75vw 1.6vw;border-radius:99px;border:1px solid #2a6584}
  .status{position:fixed;top:.4vw;left:50%;transform:translateX(-50%);font-size:.85vw;color:var(--dim)}
</style>
</head>

  <div class="pill wx" id="wx"></div>
  <div class="pill clock"><div><div class="t" id="time">--:--</div><div class="d" id="date"></div></div></div>
</header>
<main id="stage"></main>
<footer>
  <div class="segs" id="segs"></div>
  <div class="footrow">
    <div class="next"><span class="lbl">Up next</span><b id="nextTitle"></b></div>
    <div class="contact"><span>doylestownpickleball.com</span><span class="msg"><i data-lucide="message-circle"></i> Text us 267-362-9619</span></div>
  </div>
</footer>
<div class="status" id="status"></div>

<script>
/* ===== Settings =====
   SHEET_ID: the Google Sheet the slides come from (override with ?sheet=ID in the URL).
   The sheet must be shared "Anyone with the link can view". */
const SHEET_ID = new URLSearchParams(location.search).get('sheet') || '1h4-BlVZj3xosol0CQI3DXZKi8MctUGLcAfC3cTmvpxg';
const REFRESH_MINUTES = 5;
const RELOAD_HOURS = 6;
const DEFAULT_SECONDS = 10;
const LAT = 40.31, LON = -75.13;   // Doylestown, PA (weather)

const LOGO = document.querySelector('.brand img').src;

// Website colors only. [accent, lighter text tint, glow]
const ACCENTS = {logo:['#00808f','#45c4cf','rgba(0,128,143,.5)'], teal:['#2198A1','#4fbfc7','rgba(33,152,161,.45)'],
                 navy:['#1D4A62','#7fb0c8','rgba(29,74,98,.6)'], blue:['#3374FF','#7f9fff','rgba(51,116,255,.35)']};
ACCENTS.green = ACCENTS.teal; ACCENTS.orange = ACCENTS.navy; ACCENTS.black = ACCENTS.navy;
// Default icon per slide type (any Lucide icon name can be typed in the sheet's Icon column)
const TYPE_ICONS = {announcement:'megaphone', event:'calendar-days', league:'trophy', leagues:'trophy',
                    shop:'shopping-bag', schedule:'clock', lessons:'graduation-cap', community:'users'};

const FALLBACK = [
  {type:'welcome',title:'Welcome to Doylestown Pickleball',subtitle:'Group play every day · leagues · lessons · pro shop',details:'☀️ 16 outdoor courts | 🌧️ 5 indoor courts | 🕘 Open daily 7am–9pm'},
  {type:'qr',title:'Questions? Text Us',subtitle:'267-362-9619',details:'Or visit doylestownpickleball.com',link:'https://doylestownpickleball.com'}
];

let slides = [], idx = -1, timer = null;
const icons = () => { try{ window.lucide && lucide.createIcons(); }catch(e){} };

/* ---------- Clock ---------- */
function tick(){
  const n = new Date();
  document.getElementById('time').textContent = n.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  document.getElementById('date').textContent = n.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});
}
tick(); setInterval(tick, 1000);

/* ---------- Weather (Open-Meteo, free, no key) ---------- */
const WX = c => c===0?['Clear','sun']:c<=2?['Partly cloudy','cloud-sun']:c===3?['Cloudy','cloud']:c<=48?['Fog','cloud-fog']
  :c<=67||(c>=80&&c<=82)?['Rain','cloud-rain']:c<=77||c===85||c===86?['Snow','snowflake']:['Storms','cloud-lightning'];
async function loadWeather(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,wind_speed_10m`+
      `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=1`;
    const d = await (await fetch(u)).json();
    if(!d.current) throw 0;
    const [label, ico] = WX(d.current.weather_code);
    const el = document.getElementById('wx');
    el.innerHTML = `<span class="ico"><i data-lucide="${ico}"></i></span><span class="temp">${Math.round(d.current.temperature_2m)}°</span>
      <span class="meta"><b>${label}</b><br>H ${Math.round(d.daily.temperature_2m_max[0])}° · L ${Math.round(d.daily.temperature_2m_min[0])}°
      · <i data-lucide="wind" style="vertical-align:-.15em"></i> ${Math.round(d.current.wind_speed_10m)} mph · Rain ${d.daily.precipitation_probability_max[0] || 0}%</span>`;
    el.classList.add('on'); icons();
  }catch(e){ /* keep last weather, or stay hidden */ }
}
loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);

/* ---------- Sheet loading (JSONP, no CORS needed) ---------- */
function loadSheet(){
  const cb = '__sheet' + Date.now();
  const s = document.createElement('script');
  const t = setTimeout(()=>fail(), 15000);
  window[cb] = (resp)=>{ clearTimeout(t); cleanup(); try{ apply(parse(resp), true); }catch(e){ fail(); } };
  function cleanup(){ delete window[cb]; s.remove(); }
  function fail(){ clearTimeout(t); cleanup(); useCache(true); }
  s.onerror = fail;
  s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=1&tqx=responseHandler:${cb}&_=${Date.now()}`;
  document.head.appendChild(s);
}

function cellVal(c){
  if(!c || c.v === null || c.v === undefined) return '';
  if(typeof c.v === 'string' && c.v.startsWith('Date(')){
    const p = c.v.slice(5,-1).split(',').map(Number);
    return new Date(p[0], p[1], p[2] || 1);
  }
  return c.v;
}

function parse(resp){
  if(resp.status === 'error') throw new Error('sheet error');
  const cols = resp.table.cols.map(c => (c.label || '').toLowerCase());
  const find = (...names) => cols.findIndex(l => names.some(n => l.includes(n)));
  const ix = { show:find('show'), type:find('type'), title:find('title'), subtitle:find('subtitle'),
    details:find('detail'), link:find('link','image','url'), start:find('start'), end:find('end'),
    secs:find('second','duration'), accent:find('accent','color'), icon:find('icon'), photo:find('photo') };
  return resp.table.rows.map(r => { const o = {}; for(const k in ix) o[k] = ix[k] >= 0 ? cellVal(r.c[ix[k]]) : ''; return o; });
}

function toDate(v, endOfDay){
  if(!v) return null;
  const d = v instanceof Date ? new Date(v) : new Date(String(v).replace(/-/g,'/'));
  if(isNaN(d)) return null;
  if(endOfDay) d.setHours(23,59,59,999);
  return d;
}

function isLive(s){
  if(s.show === false || /^(false|no|0|off)$/i.test(String(s.show).trim())) return false;
  if(!s.title && !s.link) return false;
  const ty = String(s.type||'').toLowerCase().trim(), lk = String(s.link||'').trim();
  if((ty === 'courts' || ty === 'courtreserve') && !/^(https?:\/\/|<)/i.test(lk)) return false;  // no real CourtReserve link yet
  const now = new Date(), st = toDate(s.start), en = toDate(s.end, true);
  if(st && now < st) return false;
  if(en && now > en) return false;
  return true;
}

// Keeps "Who's on the Courts" as every 3rd slide, whatever else is in the loop
function arrange(list){
  const isCourts = x => /^(courts|courtreserve)$/i.test(String(x.type || '').trim());
  const courts = list.filter(isCourts), other = list.filter(x => !isCourts(x));
  if(!courts.length || !other.length) return list;
  const out = [];
  other.forEach((x, i) => { out.push(x); if(i % 2 === 1) out.push(courts[0]); });
  if(other.length % 2 === 1) out.push(courts[0]);
  return out;
}

function apply(rows, fresh, failed){
  let live = rows.filter(isLive);
  live = arrange(live);
  if(fresh){ try{ localStorage.setItem('dp-signage', JSON.stringify(rows)); }catch(e){} }
  document.getElementById('status').textContent = (!fresh && failed) ? 'offline · showing saved slides' : '';
  const nxt = live.length ? live : FALLBACK;
  if(JSON.stringify(nxt) === JSON.stringify(slides) && timer) return;   // nothing changed
  slides = nxt;
  build();
}

function useCache(failed){
  let rows = null;
  try{ rows = JSON.parse(localStorage.getItem('dp-signage')); }catch(e){}
  if(rows){
    rows.forEach(r => ['start','end'].forEach(k => { if(r[k]) r[k] = new Date(r[k]); }));
    apply(rows, false, failed);
  } else if(!slides.length){
    slides = FALLBACK; build();
    if(failed) document.getElementById('status').textContent = 'offline · showing default slides';
  }
}

/* ---------- Rendering ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function imgUrl(u){
  const m = String(u).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)([\w-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w1920` : u;
}
const looksLikeImage = u => /\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(u) || /drive\.google\.com|googleusercontent/.test(u);
function qrSvg(text){
  if(typeof qrcode === 'undefined') return '';
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({cellSize:8, margin:0, scalable:true});
}

function detailsHtml(d){
  if(!d) return '';
  const parts = String(d).split('|').map(x => x.trim()).filter(Boolean);
  return parts.length > 1
    ? `<div class="chips">${parts.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>`
    : `<p>${esc(d)}</p>`;
}

/* Puts a CourtReserve widget (link OR pasted embed code) into a box. Scripts in pasted code are re-created so they run. */
function mountEmbed(box, val){
  val = String(val).trim();
  if(val.startsWith('<')){
    const wrap = document.createElement('div'); wrap.className = 'embed'; wrap.innerHTML = val;
    wrap.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
      s.textContent = old.textContent; old.replaceWith(s);
    });
    box.appendChild(wrap);
  } else if(/courtreserve\.com/i.test(val)){
    mountCourtReserve(box, val);
  } else if(val){
    const f = document.createElement('iframe'); f.src = val; box.appendChild(f);
  }
}

/* CourtReserve's widget jumps back to 7 AM when it refreshes, so we don't rely on its own scrolling.
   We render it tall enough to hold the whole day, pin its header (date + court names) on top,
   and pan the schedule underneath so the current time is always in view. */
const CR = { w:1600, h:1520, header:129, startMin:7*60, rowMin:30, rowPx:47.25, dayPx:1323, leadMin:30 };
function mountCourtReserve(box, url){
  box.innerHTML = '<div class="cr head"><iframe scrolling="no"></iframe></div><div class="cr body"><iframe scrolling="no"></iframe></div>';
  box.querySelectorAll('iframe').forEach(f => { f.dataset.src = url; f.src = url; f.style.width = CR.w + 'px'; f.style.height = CR.h + 'px'; });
  box._crLayout = () => layoutCourtReserve(box);
  layoutCourtReserve(box);
}
function layoutCourtReserve(box){
  const W = box.clientWidth, H = box.clientHeight; if(!W || !H) return;
  const k = W / CR.w, headH = CR.header * k;
  const head = box.querySelector('.cr.head'), body = box.querySelector('.cr.body');
  head.style.top = '0'; head.style.height = headH + 'px';
  body.style.top = headH + 'px'; body.style.bottom = '0';
  const visible = (H - headH) / k;                                   // schedule height we can show, in widget px
  const now = new Date(), mins = now.getHours() * 60 + now.getMinutes() - CR.startMin - CR.leadMin;
  let off = Math.max(0, mins) / CR.rowMin * CR.rowPx;
  off = Math.min(off, Math.max(0, CR.dayPx - visible));
  head.querySelector('iframe').style.transform = `scale(${k})`;
  body.querySelector('iframe').style.transform = `scale(${k}) translateY(${-(CR.header + off)}px)`;
}
setInterval(() => document.querySelectorAll('.courtsBody').forEach(b => b._crLayout && b._crLayout()), 60 * 1000);
window.addEventListener('resize', () => { document.querySelectorAll('.courtsBody').forEach(b => b._crLayout && b._crLayout()); document.querySelectorAll('.slide').forEach(fitSlide); });
function tickNow(){ const t = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  document.querySelectorAll('.courtsHead .now').forEach(n => n.textContent = t); }
setInterval(tickNow, 20 * 1000);
/* Shrink a slide's text (and QR) until everything fits inside the slide */
function fitSlide(el){
  if(!el || el.classList.contains('courts') || el.classList.contains('photo')) return;
  const parts = el.querySelectorAll('.txt, .qr');
  parts.forEach(p => p.style.transform = '');
  const cs = getComputedStyle(el);
  const availH = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if(!availH) return;
  parts.forEach(p => {
    const h = p.scrollHeight, w = p.scrollWidth, cw = p.clientWidth || w;
    const k = Math.min(1, (availH * 0.94) / h, cw / w);
    if(k < 0.995) p.style.transform = 'scale(' + Math.max(0.5, k).toFixed(3) + ')';
  });
}

function render(s){
  let type = String(s.type || 'announcement').toLowerCase().trim();
  if(type === 'blog'){ s = Object.assign({}, s, {label:'Club News', scanText:'Scan to read more'}); type = 'qr'; }
  const el = document.createElement('section');
  el.className = 'slide';
  const acc = String(s.accent || '').toLowerCase().trim();
  const a = ACCENTS[acc] || ACCENTS.teal;
  el.style.setProperty('--accent', a[0]); el.style.setProperty('--accent-text', a[1]); el.style.setProperty('--accent-glow', a[2]);
  const link = String(s.link || '').trim();
  const photo = String(s.photo || '').trim();
  const picHtml = photo ? `<div class="pic"><img src="${esc(imgUrl(photo))}" alt=""></div>` : '';
  if(photo) el.classList.add('hasPic');

  if(type === 'courts' || type === 'courtreserve'){
    el.classList.add('courts');
    el.innerHTML = `<div class="courtsHead"><h1>${esc(s.title || "Who's on the Courts")}</h1>
      <div class="live"><i></i>LIVE</div><div class="now"></div></div><div class="courtsBody"></div>`;
    mountEmbed(el.querySelector('.courtsBody'), link);
    return el;
  }
  if(type === 'image' || (type !== 'qr' && link && looksLikeImage(link))){
    el.classList.add('photo');
    el.innerHTML = `<img class="bg" src="${esc(imgUrl(link))}" alt="">
      ${s.title ? `<div class="cap txt"><h1>${esc(s.title)}</h1>${s.subtitle?`<h2>${esc(s.subtitle)}</h2>`:''}</div>` : ''}`;
    return el;
  }
  function heroTitle(t){ const m = String(t||'').match(/^(welcome to)\s+(.+)$/i);
    return m ? `<span class="pre">${esc(m[1])}</span>${esc(m[2])}` : esc(t); }
  if(type === 'welcome'){
    el.classList.add('hero');
    el.innerHTML = picHtml + `<div class="txt"><img class="heroLogo" src="${LOGO}" alt="">
      <h1>${heroTitle(s.title)}</h1>${s.subtitle?`<h2>${esc(s.subtitle)}</h2>`:''}${detailsHtml(s.details)}</div>`;
    return el;
  }
  const label = {announcement:'Announcement',event:'Event',qr:'Scan Me',league:'Leagues',leagues:'Leagues',
                 schedule:'Schedule',shop:'Pro Shop',lessons:'Lessons',community:'Community'}[type];
  const label2 = s.label ? s.label : (label === undefined ? type : label);
  const icon = String(s.icon || '').trim() || TYPE_ICONS[type] || 'sparkles';
  let visual;
  if(type === 'qr' && link){
    visual = `<div class="qr"><div class="code">${qrSvg(link)}</div><span><i data-lucide="scan-line"></i>${esc(s.scanText || 'Scan with your camera')}</span></div>`;
  } else if(photo){
    visual = '';
  } else {
    visual = `<div class="tile"><span class="big"><i data-lucide="${esc(icon)}"></i></span></div>`;
  }
  el.innerHTML = picHtml + `<div class="txt">
      ${label2 ? `<div class="eyebrow">${esc(label2)}</div>` : ''}
      <h1>${esc(s.title)}</h1>${s.subtitle ? `<h2>${esc(s.subtitle)}</h2>` : ''}${detailsHtml(s.details)}</div>${visual}`;
  return el;
}

function build(){
  const stage = document.getElementById('stage'), segs = document.getElementById('segs');
  stage.innerHTML = ''; segs.innerHTML = '';
  slides.forEach(s => {
    stage.appendChild(render(s));
    const g = document.createElement('div'); g.className = 'seg'; g.innerHTML = '<i></i>'; segs.appendChild(g);
  });
  icons();
  idx = -1; next();
}

function next(){
  clearTimeout(timer);
  const els = document.querySelectorAll('.slide'), sg = document.querySelectorAll('.seg');
  if(!els.length) return;
  if(idx >= 0 && els[idx]) els[idx].classList.remove('on');
  idx = (idx + 1) % els.length;
  els[idx].classList.add('on');
  const isCourts = els[idx].classList.contains('courts');
  document.body.classList.toggle('wide', isCourts);
  tickNow(); fitSlide(els[idx]);
  const secs = Number(slides[idx].secs) || (isCourts ? 30 : DEFAULT_SECONDS);
  sg.forEach((g, i) => {
    const f = g.firstChild;
    g.classList.toggle('done', i < idx);
    f.style.transition = 'none'; f.style.width = i < idx ? '100%' : '0';
  });
  const cur = sg[idx].firstChild;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ cur.style.transition = `width ${secs}s linear`; cur.style.width = '100%'; }));
  document.getElementById('nextTitle').textContent = slides[(idx + 1) % slides.length].title || '';
  // Reload the CourtReserve widget one slide early so it opens fresh, scrolled to the current time
  const upcoming = els[(idx + 1) % els.length];
  if(upcoming && upcoming !== els[idx]){
    upcoming.querySelectorAll('.courtsBody iframe').forEach(f => {
      const base = f.dataset.src || f.src; f.dataset.src = base;
      f.src = base + (base.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
    });
    const cb = upcoming.querySelector('.courtsBody'); if(cb && cb._crLayout) cb._crLayout();
  }
  const cbNow = els[idx].querySelector('.courtsBody'); if(cbNow && cbNow._crLayout) cbNow._crLayout();
  timer = setTimeout(next, secs * 1000);
}

/* ---------- Start ---------- */
icons();
useCache(false);
loadSheet();
setInterval(loadSheet, REFRESH_MINUTES * 60 * 1000);
setTimeout(()=>location.reload(), RELOAD_HOURS * 3600 * 1000);
</script>
</body>
</html>
